<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Snake</h1>
      <div class="stats">
        <div class="stat"><span class="label">Punkte</span><span id="score" class="value">0</span></div>
        <div class="stat"><span class="label">Rekord</span><span id="highscore" class="value">0</span></div>
        <div class="stat"><span class="label">Level</span><span id="level" class="value">1</span></div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="480" height="480" aria-label="Spielfeld"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Snake</h2>
        <p id="overlay-text">Friss das Futter, wachse – und beiß dich nicht selbst.</p>
        <button id="start-btn" type="button">Spiel starten</button>
        <p class="hint">Steuerung: Pfeiltasten / WASD · Leertaste = Pause · Wischen auf dem Handy</p>
      </div>
    </div>

    <div class="options">
      <label><input type="checkbox" id="wrap-toggle"> Durch Wände gehen</label>
      <label>Tempo
        <select id="speed-select">
          <option value="160">Langsam</option>
          <option value="120" selected>Normal</option>
          <option value="85">Schnell</option>
        </select>
      </label>
    </div>

    <div class="dpad" aria-label="Steuerkreuz">
      <button type="button" data-dir="up" aria-label="Hoch">▲</button>
      <button type="button" data-dir="left" aria-label="Links">◀</button>
      <button type="button" id="pause-btn" aria-label="Pause">❚❚</button>
      <button type="button" data-dir="right" aria-label="Rechts">▶</button>
      <button type="button" data-dir="down" aria-label="Runter">▼</button>
    </div>
  </main>
  <script src="snake.js"></script>
</body>
</html>
